name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Check & Build (shared) ────────────────────────────────────────────────
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v${tag_version} does not match package.json version ${pkg_version}"
            exit 1
          fi
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - name: Smoke test packed tarball
        run: |
          mkdir -p /tmp/smoke
          npm pack --pack-destination /tmp/smoke >/dev/null
          tarball="$(ls /tmp/smoke/saros-proxy-*.tgz | head -n1)"
          mkdir -p /tmp/smoke/install && cd /tmp/smoke/install
          npm init -y >/dev/null 2>&1
          npm install "$tarball" --no-audit --no-fund >/dev/null 2>&1
          node_modules/.bin/saros-proxy --version
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # ── Publish to npmjs.org ──────────────────────────────────────────────────
  publish-npm:
    name: Publish to npmjs.org
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC — trusted publishing + npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish
        # Trusted publishing (OIDC): the npm registry exchanges this job's
        # id-token for a short-lived publishing credential and attaches
        # provenance automatically. No NPM_TOKEN and no `registry-url` —
        # setup-node's generated .npmrc would point the auth at an empty
        # ${NODE_AUTH_TOKEN} and pre-empt the OIDC handshake.
        run: npm publish --access public --ignore-scripts

  # ── Publish to GitHub Packages ────────────────────────────────────────────
  publish-github:
    name: Publish to GitHub Packages
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vitorvilaca3011'
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish
        run: |
          cp package.json package.json.bak
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@vitorvilaca3011/saros-proxy';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --access public --ignore-scripts
          mv package.json.bak package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
